<!DOCTYPE html>
<!--
  backend/tests/frontend/review_integrity.html

  0.8.4 — CIE-11 review, batch 1 (frontend half; the backend half is
  tests/test_review_integrity.py). A second job or a stale poll loop used
  to silently re-render an open review screen with a later run (the
  3 Nov "5A24/5A11 on screen, no code in the note" investigation), and
  confirm read session_id after an await. Each case runs in its own
  iframe that loads the REAL static/utils.js, session-detail-render.js and
  app.js against a
  fake server (fetch stub) and a DOM whose missing ids are created on
  demand, then drives the real buttons and functions:

    1  double click on Procesar          → one job; Procesar disabled until it ends
    2  stale loop vs. Cancelar           → a superseded loop stops polling and never
                                           renders; Cancelar stops the active loop
    3  new upload while a job runs       → Procesar stays disabled, no second job
    4  new run while a review is open    → asks first; "No" keeps the review,
                                           "Sí" replaces it with the new run only
    5  slow getAuthHeaders on Confirmar  → the request carries the session_id read
                                           with the form; Confirmar disabled meanwhile
    6  confirm answers 503               → review restored with its code, Confirmar
                                           re-enabled, retry confirms the same session

  0.8.5 — CIE-11 review, batch 2 (backend half: tests/test_cie11_integrity.py):
    7  code edit                         → hidden WHO title cleared, cie11_fuente
                                           "medico"; back to the WHO value restores it
    8  diagnosis edit                    → "El diagnóstico cambió; verifique el código
                                           CIE-11." shown; the code itself untouched
    9  malformed / empty code            → "Revise el formato del código CIE-11." warns
                                           but Confirmar still signs; normalised on change;
                                           no WHO code → "No se obtuvo código CIE-11"
   10  diagnósticos adicionales          → prefilled one per line, edited, carried
                                           through confirm, rendered in the summary

  The notes' wording lives in templates/index.html (a static server can't
  render Jinja); test_cie11_integrity.py pins it. Here only visibility is checked.

  Timers inside the iframes run 50× faster (the real 2 s poll delay is 40 ms).

  How to run (same as the other harnesses):
    1. Serve backend/ over HTTP, e.g. `cd backend && python3 -m http.server 8765`.
    2. Open http://localhost:8765/tests/frontend/review_integrity.html
    3. Read the on-page summary (or console / window.__RESULT__).

  No PHI: every value below is invented.
-->
<html lang="es">
<head><meta charset="utf-8"><title>review integrity</title></head>
<body>
<script>
const params = new URLSearchParams(location.search);
const CASE = params.get('case');

if (CASE) {
    // ── Child: one case, one fresh copy of app.js ───────────────────────
    const FORM_IDS = ['numero_expediente', 'nombre_del_paciente', 'fecha_de_nacimiento', 'curp', 'edad',
        'genero', 'motivo_de_consulta', 'sintomas', 'historia_de_enfermedad_actual', 'duracion_sintomas',
        'presion_arterial', 'frecuencia_cardiaca', 'temperatura', 'frecuencia_respiratoria',
        'saturacion_oxigeno', 'peso', 'talla', 'habitus', 'examen_fisico', 'diagnostico', 'codigo_cie11',
        'titulo_cie11', 'impresion_clinica', 'pronostico', 'tratamiento', 'medicamentos', 'recomendaciones',
        'estudios_solicitados', 'seguimiento', 'fecha_hora_consulta'];
    const TEXTAREA_IDS = ['diagnosticos_adicionales'];
    const CHECKBOXES = ['consentCheckbox', 'consentTratamiento', 'createPDF', 'sendEmailToggle', 'printRawTranscript'];
    let html = '<form id="reviewForm">';
    FORM_IDS.forEach(f => { html += `<input type="text" class="review-input" id="review_${f}">`; });
    TEXTAREA_IDS.forEach(f => { html += `<textarea class="review-textarea" id="review_${f}"></textarea>`; });
    html += '</form>';
    CHECKBOXES.forEach(id => { html += `<input type="checkbox" id="${id}">`; });
    html += '<input type="file" id="audioFileInput"><select id="speakersExpected"><option value="2">2</option></select>';
    html += '<audio id="audioPlayer"></audio>';
    const root = document.createElement("div");
    root.innerHTML = html;
    document.body.appendChild(root);
    // Any other id app.js asks for gets created on first use (a <button>
    // for *Btn ids), so the harness never drifts from index.html's id list.
    const realGet = document.getElementById.bind(document);
    document.getElementById = (id) => {
        let el = realGet(id);
        if (!el) {
            el = document.createElement(/Btn$/.test(id) ? 'button' : 'div');
            el.id = id;
            document.body.appendChild(el);
        }
        return el;
    };

    const realSetTimeout = window.setTimeout.bind(window);
    window.setTimeout = (fn, ms, ...a) => realSetTimeout(fn, Math.max(1, (ms || 0) / 50), ...a);
    window.confirm = (msg) => { H.prompts.push(msg); return H.confirmAnswer; };
    window.alert = () => {};

    // Fake server. Each job finishes after `doneAfter` job-status polls.
    const H = window.H = {
        prompts: [], confirmAnswer: true, authDelayMs: 0, confirmStatus: [200],
        submitted: 0, polls: {}, confirmBodies: [],
        jobs: {
            'job-1': { doneAfter: 2, session: 'SESSION-FAKE-1',
                       sd: { evaluacion: { diagnostico: 'Diagnóstico ficticio A', codigo_cie11: '5A24/5A11', titulo_cie11: 'Título ficticio A',
                                           cie11_fuente: 'oms', diagnosticos_adicionales: ['Adicional ficticio uno', 'Adicional ficticio dos'] } } },
            'job-2': { doneAfter: 6, session: 'SESSION-FAKE-2',
                       sd: { evaluacion: { diagnostico: 'Diagnóstico ficticio B' } } },
        },
        pending: { 'SESSION-FAKE-P': { evaluacion: { diagnostico: 'Diagnóstico ficticio P', codigo_cie11: '1A00', titulo_cie11: 'Título ficticio P' } } },
    };
    window.supabaseClient = { auth: { getSession: async () => ({ data: { session: { access_token: 'fake' } } }) } };
    window.getAuthHeaders = async () => {
        if (H.authDelayMs) await new Promise(r => realSetTimeout(r, H.authDelayMs));
        return { Authorization: 'Bearer fake' };
    };
    window.handleSessionExpired = () => {};
    window.logout = () => {};
    window.fetch = async (url, opts = {}) => {
        const json = (status, body) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
        const u = String(url);
        if (u.endsWith('/api/session-check')) return json(200, { valid: true, rol: 'medico', clinica_id: 'clinic-fixture' });
        if (u.endsWith('/api/process-audio')) {
            H.submitted += 1;
            return json(202, { job_id: `job-${H.submitted}` });
        }
        let m = u.match(/\/api\/job-status\/(job-\d+)$/);
        if (m) {
            const j = H.jobs[m[1]];
            H.polls[m[1]] = (H.polls[m[1]] || 0) + 1;
            if (H.polls[m[1]] >= j.doneAfter) {
                return json(200, { status: 'done', session_id: j.session, structured_data: JSON.parse(JSON.stringify(j.sd)), transcript: { text: 'x' } });
            }
            return json(200, { status: 'extracting' });
        }
        m = u.match(/\/api\/pending-sessions\/(SESSION-[A-Z0-9-]+)$/);
        if (m && H.pending[m[1]]) {
            return json(200, { session_id: m[1], structured_data: JSON.parse(JSON.stringify(H.pending[m[1]])), transcript: { text: 'x' } });
        }
        if (u.endsWith('/api/pending-sessions')) return json(200, { sessions: [] });
        if (u.endsWith('/api/confirm-and-generate')) {
            const body = JSON.parse(opts.body);
            H.confirmBodies.push(body);
            const status = H.confirmStatus.length > 1 ? H.confirmStatus.shift() : H.confirmStatus[0];
            if (status !== 200) return json(status, { error: 'No se pudo guardar la nota. Intente de nuevo.', error_code: 'CONFIRM_SAVE_FAILED' });
            return json(200, { session_id: body.session_id, status: 'success', structured_data: body.structured_data, pdf_available: true });
        }
        return json(404, { error: 'No encontrado' });
    };

    const v = Date.now();
    // Cache-busted, so an edit to app.js is always what gets tested.
    document.write(`<script src="/static/utils.js?v=${v}"><\/script><script src="/static/session-detail-render.js?v=${v}"><\/script><script src="/static/app.js?v=${v}"><\/script>`);
    window.addEventListener('load', () => realSetTimeout(runCase, 50));

    const wait = (ms) => new Promise(r => realSetTimeout(r, ms));
    const until = async (cond, ms = 3000) => {
        const t0 = Date.now();
        while (!cond()) { if (Date.now() - t0 > ms) return false; await wait(5); }
        return true;
    };
    const $ = (id) => document.getElementById(id);
    const reviewShown = () => $('reviewSection').style.display === 'block';
    const code = () => $('review_codigo_cie11').value;
    const shownSession = () => state.pendingResult && state.pendingResult.session_id;
    const giveAudio = () => handleFileUpload({ target: { files: [new File(['fake-audio'], 'consulta-ficticia.webm', { type: 'audio/webm' })] } });
    const type = (id, value, alsoChange) => {
        const el = $(id);
        el.value = value;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        if (alsoChange) el.dispatchEvent(new Event('change', { bubbles: true }));
    };
    const shownNote = (id) => $(id).hidden === false;
    const openJob1Review = async () => { giveAudio(); $('processBtn').click(); await until(reviewShown); };
    const lastEv = () => (H.confirmBodies[H.confirmBodies.length - 1] || { structured_data: {} }).structured_data.evaluacion || {};
    const checkConsentAndConfirm = () => {
        if (!$('consentTratamiento').checked) $('consentTratamiento').click();   // real change handler enables Confirmar
        $('confirmAndGenerateBtn').click();
    };

    const CASES = {
        async double_click(c) {
            giveAudio();
            c.check('Procesar enabled with audio', $('processBtn').disabled === false);
            $('processBtn').click();
            c.check('Procesar disabled right after the click', $('processBtn').disabled === true);
            $('processBtn').click();          // disabled: no click event
            await processAudio();             // and a direct second call is a no-op
            await until(reviewShown);
            c.check('one job submitted', H.submitted === 1, H.submitted);
            c.check('review shows job 1 with its code', shownSession() === 'SESSION-FAKE-1' && code() === '5A24/5A11', `${shownSession()} ${code()}`);
            c.check('Procesar re-enabled once the job ended', $('processBtn').disabled === false);
            await wait(400);
            c.check('review unchanged later', shownSession() === 'SESSION-FAKE-1' && code() === '5A24/5A11', `${shownSession()} ${code()}`);
            checkConsentAndConfirm();
            await until(() => H.confirmBodies.length === 1);
            const b = H.confirmBodies[0];
            c.check('confirm signs SESSION-FAKE-1 with its code', b.session_id === 'SESSION-FAKE-1' && b.structured_data.evaluacion.codigo_cie11 === '5A24/5A11', JSON.stringify({ s: b.session_id, ev: b.structured_data.evaluacion }));
            await until(() => $('resultsSection').style.display === 'block');
            c.check('success shows results, not the review', $('resultsSection').style.display === 'block' && !reviewShown());
            c.check('Procesar enabled again after confirming', $('processBtn').disabled === false);
        },

        async stale_loop_and_cancel(c) {
            // A superseded loop (the pre-0.8.4 double-job shape, forced
            // directly): job 1 finishes first but job 2 is the active one.
            H.jobs['job-1'].doneAfter = 3; H.jobs['job-2'].doneAfter = 12;
            startJobPolling('job-1');
            startJobPolling('job-2');
            await wait(300);
            const polls1 = H.polls['job-1'] || 0;
            c.check('superseded job 1 never rendered a review', !reviewShown() && !state.pendingResult, shownSession());
            await wait(300);
            c.check('superseded loop stopped polling', (H.polls['job-1'] || 0) === polls1 && polls1 <= 1, `polls=${H.polls['job-1']}`);
            // Open a pending note while job 2 still runs, then Cancelar.
            await continuePendingSession('SESSION-FAKE-P');
            c.check('pending note shown', shownSession() === 'SESSION-FAKE-P' && code() === '1A00', `${shownSession()} ${code()}`);
            const polls2 = H.polls['job-2'];
            $('cancelReviewBtn').click();
            await wait(800);   // well past job 2's doneAfter
            c.check('after Cancelar no review re-opens', !reviewShown() && !state.pendingResult, shownSession());
            c.check('active loop stopped by opening the note / Cancelar', H.polls['job-2'] === polls2, `polls=${H.polls['job-2']} vs ${polls2}`);
            c.check('no confirm sent', H.confirmBodies.length === 0);
        },

        async upload_during_job(c) {
            H.jobs['job-1'].doneAfter = 8;
            giveAudio();
            $('processBtn').click();
            await wait(60);
            giveAudio();       // a new file is selected mid-job
            c.check('Procesar stays disabled after a new upload mid-job', $('processBtn').disabled === true);
            $('processBtn').click();
            await processAudio();
            c.check('still one job', H.submitted === 1, H.submitted);
            await until(reviewShown);
            await wait(300);
            c.check('review shows job 1 only', shownSession() === 'SESSION-FAKE-1' && code() === '5A24/5A11', `${shownSession()} ${code()}`);
        },

        async new_run_with_review_open(c) {
            giveAudio();
            $('processBtn').click();
            await until(reviewShown);
            $('review_codigo_cie11').value = '5A11';     // the doctor's own edit
            H.confirmAnswer = false;
            $('processBtn').click();
            await wait(100);
            c.check('asked before replacing', H.prompts.length === 1 && H.prompts[0].startsWith('Esto genera una nota nueva y reemplaza la revisión actual'), H.prompts[0]);
            c.check('"No": no new job, review and edit kept', H.submitted === 1 && reviewShown() && shownSession() === 'SESSION-FAKE-1' && code() === '5A11', `${H.submitted} ${shownSession()} ${code()}`);
            H.confirmAnswer = true;
            $('processBtn').click();
            await wait(10);
            c.check('"Sí": old review hidden at once', !reviewShown() && !state.pendingResult);
            await until(reviewShown);
            c.check('review shows the new run', H.submitted === 2 && shownSession() === 'SESSION-FAKE-2' && code() === '', `${H.submitted} ${shownSession()} ${code()}`);
        },

        async slow_auth_confirm_race(c) {
            giveAudio();
            $('processBtn').click();
            await until(reviewShown);
            H.authDelayMs = 300;
            checkConsentAndConfirm();
            await wait(20);
            c.check('Confirmar disabled during the request', $('confirmAndGenerateBtn').disabled === true);
            // Something re-renders the review while getAuthHeaders() is
            // still pending — the old code would then read session B.
            displayReviewScreen({ session_id: 'SESSION-FAKE-2', status: 'pending_review', transcript: { text: 'x' }, structured_data: H.jobs['job-2'].sd });
            $('confirmAndGenerateBtn').disabled = false;  // even if re-enabled, a 2nd confirm is refused
            $('confirmAndGenerateBtn').click();
            await until(() => H.confirmBodies.length >= 1, 2000);
            await wait(400);
            c.check('exactly one confirm request', H.confirmBodies.length === 1, H.confirmBodies.length);
            const b = H.confirmBodies[0] || { structured_data: { evaluacion: {} } };
            c.check('request carries SESSION-FAKE-1 with its own content', b.session_id === 'SESSION-FAKE-1' && b.structured_data.evaluacion.codigo_cie11 === '5A24/5A11', JSON.stringify({ s: b.session_id, ev: b.structured_data.evaluacion }));
        },

        async confirm_save_fails(c) {
            H.confirmStatus = [503, 200];
            giveAudio();
            $('processBtn').click();
            await until(reviewShown);
            checkConsentAndConfirm();
            await until(() => H.confirmBodies.length === 1 && reviewShown());
            await wait(50);
            c.check('review restored with its code', reviewShown() && shownSession() === 'SESSION-FAKE-1' && code() === '5A24/5A11', `${shownSession()} ${code()}`);
            c.check('error shown with the server message', $('errorMessage').textContent.includes('No se pudo guardar la nota. Intente de nuevo.'), $('errorMessage').textContent);
            c.check('Confirmar re-enabled (consent still checked)', $('confirmAndGenerateBtn').disabled === false);
            $('confirmAndGenerateBtn').click();
            await until(() => H.confirmBodies.length === 2);
            c.check('retry confirms the same session and code', H.confirmBodies[1].session_id === 'SESSION-FAKE-1' && H.confirmBodies[1].structured_data.evaluacion.codigo_cie11 === '5A24/5A11');
            await until(() => $('resultsSection').style.display === 'block');
            c.check('retry ends on the results screen', $('resultsSection').style.display === 'block' && !reviewShown());
        },
    };

    Object.assign(CASES, {
        async code_edit_clears_title(c) {
            await openJob1Review();
            c.check('WHO code and title prefilled', code() === '5A24/5A11' && $('review_titulo_cie11').value === 'Título ficticio A', `${code()} | ${$('review_titulo_cie11').value}`);
            type('review_codigo_cie11', '5A11');
            c.check('editing the code clears the hidden title', $('review_titulo_cie11').value === '');
            type('review_codigo_cie11', ' 5a24/5a11 ');
            c.check('typing the WHO value back restores its title', $('review_titulo_cie11').value === 'Título ficticio A');
            c.check('built note: WHO value → fuente oms with title', JSON.stringify(buildStructuredDataFromForm().evaluacion) === JSON.stringify({
                diagnostico: 'Diagnóstico ficticio A', diagnosticos_adicionales: ['Adicional ficticio uno', 'Adicional ficticio dos'],
                codigo_cie11: '5A24/5A11', cie11_fuente: 'oms', titulo_cie11: 'Título ficticio A' }), JSON.stringify(buildStructuredDataFromForm().evaluacion));
            type('review_codigo_cie11', '5A11', true);
            checkConsentAndConfirm();
            await until(() => H.confirmBodies.length === 1);
            const ev = lastEv();
            c.check('confirm sends the doctor\'s code: fuente medico, no title', ev.codigo_cie11 === '5A11' && ev.cie11_fuente === 'medico' && !('titulo_cie11' in ev), JSON.stringify(ev));
        },

        async diagnosis_edit_hint(c) {
            await openJob1Review();
            c.check('no hint when the review opens', !shownNote('review_cie11_dx_cambio'));
            type('review_diagnostico', 'Diagnóstico ficticio A, corregido');
            c.check('editing the diagnosis shows the hint', shownNote('review_cie11_dx_cambio'));
            c.check('the code is not changed automatically', code() === '5A24/5A11' && $('review_titulo_cie11').value === 'Título ficticio A');
            type('review_diagnostico', 'Diagnóstico ficticio A');
            c.check('back to the original diagnosis hides it', !shownNote('review_cie11_dx_cambio'));
            type('review_diagnostico', 'Otro diagnóstico ficticio');
            type('review_codigo_cie11', '');
            c.check('no hint while the code is empty', !shownNote('review_cie11_dx_cambio'));
        },

        async malformed_code_warning(c) {
            await openJob1Review();
            c.check('valid cluster: no format warning', !shownNote('review_cie11_formato') && !shownNote('review_cie11_vacio'));
            type('review_codigo_cie11', 'abc');
            c.check('malformed code warns', shownNote('review_cie11_formato'));
            type('review_codigo_cie11', ' 5a 11 ', true);
            c.check('normalised on change, warning gone', code() === '5A11' && !shownNote('review_cie11_formato'), code());
            type('review_codigo_cie11', 'abc', true);
            if (!$('consentTratamiento').checked) $('consentTratamiento').click();
            c.check('Confirmar still enabled with a malformed code', $('confirmAndGenerateBtn').disabled === false);
            $('confirmAndGenerateBtn').click();
            await until(() => H.confirmBodies.length === 1);
            const ev = lastEv();
            c.check('malformed code is signed as typed (normalised), fuente medico', ev.codigo_cie11 === 'ABC' && ev.cie11_fuente === 'medico' && !('titulo_cie11' in ev), JSON.stringify(ev));
        },

        async no_who_code_note(c) {
            H.jobs['job-1'].sd = H.jobs['job-2'].sd;   // a run whose lookup found nothing
            await openJob1Review();
            c.check('empty field shows the "No se obtuvo código CIE-11" note', shownNote('review_cie11_vacio'));
            c.check('no format warning on an empty field', !shownNote('review_cie11_formato'));
            type('review_codigo_cie11', '5a11', true);
            c.check('typing a code hides the note', !shownNote('review_cie11_vacio'));
            c.check('typed code is the doctor\'s', JSON.stringify(buildStructuredDataFromForm().evaluacion) === JSON.stringify({ diagnostico: 'Diagnóstico ficticio B', codigo_cie11: '5A11', cie11_fuente: 'medico' }), JSON.stringify(buildStructuredDataFromForm().evaluacion));
        },

        async adicionales_roundtrip(c) {
            await openJob1Review();
            c.check('prefilled one per line', $('review_diagnosticos_adicionales').value === 'Adicional ficticio uno\nAdicional ficticio dos', JSON.stringify($('review_diagnosticos_adicionales').value));
            $('review_diagnosticos_adicionales').value += '\n  Adicional ficticio tres  \n\n';
            checkConsentAndConfirm();
            await until(() => H.confirmBodies.length === 1);
            const ev = lastEv();
            c.check('confirm carries the edited list', JSON.stringify(ev.diagnosticos_adicionales) === JSON.stringify(['Adicional ficticio uno', 'Adicional ficticio dos', 'Adicional ficticio tres']), JSON.stringify(ev.diagnosticos_adicionales));
            await until(() => $('resultsSection').style.display === 'block');
            const html = $('formattedData').innerHTML;
            c.check('summary renders them', html.includes('Diagnósticos Adicionales') && html.includes('<li>Adicional ficticio tres</li>'), html.slice(0, 200));
        },
    });

    async function runCase() {
        const checks = [];
        const c = { check: (name, pass, detail) => checks.push({ name, pass: !!pass, detail: pass ? undefined : detail }) };
        try { await CASES[CASE](c); } catch (e) { checks.push({ name: 'threw', pass: false, detail: String(e && e.stack || e) }); }
        parent.postMessage({ case: CASE, checks }, '*');
    }
} else {
    // ── Runner ───────────────────────────────────────────────────────────
    const NAMES = ['double_click', 'stale_loop_and_cancel', 'upload_during_job', 'new_run_with_review_open', 'slow_auth_confirm_race', 'confirm_save_fails',
                   'code_edit_clears_title', 'diagnosis_edit_hint', 'malformed_code_warning', 'no_who_code_note', 'adicionales_roundtrip'];
    const out = document.createElement('pre');
    out.textContent = 'running…';
    document.body.appendChild(out);
    const results = {};
    window.addEventListener('message', (e) => {
        if (!e.data || !e.data.case) return;
        results[e.data.case] = e.data.checks;
        if (Object.keys(results).length < NAMES.length) return;
        const lines = [];
        let pass = 0, fail = 0;
        NAMES.forEach(n => {
            results[n].forEach(ch => {
                ch.pass ? pass++ : fail++;
                lines.push(`${ch.pass ? 'PASS' : 'FAIL'}  ${n}: ${ch.name}${ch.pass ? '' : '  — ' + ch.detail}`);
            });
        });
        lines.push('', `${fail === 0 ? 'ALL PASS' : 'FAILURES'}: ${pass} passed, ${fail} failed`);
        out.textContent = lines.join('\n');
        console.log(out.textContent);
        window.__RESULT__ = { pass, fail, results };
    });
    NAMES.forEach(n => {
        const f = document.createElement('iframe');
        f.src = `${location.pathname}?case=${n}`;
        f.width = 160; f.height = 40;
        document.body.appendChild(f);
    });
}
</script>
</body>
</html>
