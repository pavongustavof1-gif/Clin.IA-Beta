<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Contraseña - Clin.IA™</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon/android-chrome-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='favicon/android-chrome-512x512.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .login-header h1 {
            font-family: 'DM Serif Display', Georgia, serif;
            font-weight: 400;
            font-style: italic;
            font-size: 2.4rem;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .login-field {
            margin-bottom: var(--spacing-md);
        }

        .login-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .login-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            padding: 0.65rem 0.85rem;
            line-height: 1.5;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .login-input:focus {
            outline: none;
            border-color: #7b9cef;
            box-shadow: 0 0 0 3px rgba(123,156,239,0.15);
        }

        .login-error {
            display: none;
            background: rgba(224, 82, 82, 0.08);
            border: 1px solid rgba(224, 82, 82, 0.25);
            border-radius: var(--radius-sm);
            color: #c0392b;
            font-size: 0.86rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .login-success {
            display: none;
            background: rgba(15, 110, 86, 0.08);
            border: 1px solid rgba(15, 110, 86, 0.25);
            border-radius: var(--radius-sm);
            color: #0F6E56;
            font-size: 0.86rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .invalid-link-message {
            display: none;
            text-align: center;
        }

        .invalid-link-message p {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        #setPasswordBtn {
            max-width: 100%;
            margin-top: var(--spacing-xs);
        }
    </style>
</head>
<body>

    <div class="login-page">
        <div class="card login-card">
            <div class="login-header">
                <h1>Clin.IA™</h1>
                <p>Configurar Contraseña</p>
            </div>

            <div id="checkingMessage" class="invalid-link-message" style="display: block;">
                <p>Verificando enlace...</p>
            </div>

            <div id="invalidLinkMessage" class="invalid-link-message">
                <p>Este enlace no es válido o ha expirado.</p>
                <a href="/login" class="btn btn-secondary">Volver a Iniciar Sesión</a>
            </div>

            <div id="setPasswordFormWrap" style="display: none;">
                <div id="setPasswordError" class="login-error"></div>
                <div id="setPasswordSuccess" class="login-success"></div>

                <form id="setPasswordForm">
                    <div class="login-field">
                        <label class="login-label" for="newPassword">Nueva contraseña</label>
                        <input type="password" id="newPassword" class="login-input" autocomplete="new-password" required>
                    </div>
                    <div class="login-field">
                        <label class="login-label" for="confirmPassword">Confirmar contraseña</label>
                        <input type="password" id="confirmPassword" class="login-input" autocomplete="new-password" required>
                    </div>
                    <button type="submit" id="setPasswordBtn" class="btn btn-primary">Configurar Contraseña</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
    <script nonce="{{ csp_nonce }}">
        window.CLINIA_CONFIG = { supabaseUrl: "{{ supabase_url }}", supabaseAnonKey: "{{ supabase_anon_key }}" };
    </script>
    <script src="{{ url_for('static', filename='auth-common.js') }}"></script>
    <script nonce="{{ csp_nonce }}">
        // set-password.html's own flow (invite-link session detection via
        // detectSessionInUrl, password set) — legitimately page-specific,
        // uses the shared supabaseClient from auth-common.js. Stage E3
        // note: this page's createClient call previously omitted the
        // storage/storageKey config every other template had (a real,
        // if harmless, drift — the page always redirects to /login after
        // success regardless, so nothing here ever read the session back
        // under the default key). Consolidating onto the shared client
        // fixes that silently: the invite session, and any leftover
        // token, now live under sessionStorage/clinia_token like
        // everywhere else, instead of an orphaned entry under Supabase's
        // default storage key.
        const checkingMessage = document.getElementById('checkingMessage');
        const invalidLinkMessage = document.getElementById('invalidLinkMessage');
        const formWrap = document.getElementById('setPasswordFormWrap');
        const form = document.getElementById('setPasswordForm');
        const errorBox = document.getElementById('setPasswordError');
        const successBox = document.getElementById('setPasswordSuccess');
        const setPasswordBtn = document.getElementById('setPasswordBtn');

        let sessionConfirmed = false;

        function showInvalidLink() {
            if (sessionConfirmed) return;
            checkingMessage.style.display = 'none';
            invalidLinkMessage.style.display = 'block';
        }

        function showForm() {
            if (sessionConfirmed) return;
            sessionConfirmed = true;
            checkingMessage.style.display = 'none';
            invalidLinkMessage.style.display = 'none';
            formWrap.style.display = 'block';
        }

        // detectSessionInUrl (default true) automatically parses the hash
        // fragment (#access_token=...&refresh_token=...&type=invite) and
        // establishes a session. We confirm it worked via onAuthStateChange
        // rather than assuming — SIGNED_IN or PASSWORD_RECOVERY both mean
        // a valid session was established from the link.
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if ((event === 'SIGNED_IN' || event === 'PASSWORD_RECOVERY') && session) {
                showForm();
            }
        });

        // Fallback: if no session is confirmed shortly after load, the link
        // was invalid/expired (or someone navigated here directly) — don't
        // show a form that will just fail.
        setTimeout(() => {
            if (!sessionConfirmed) {
                showInvalidLink();
            }
        }, 3000);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            successBox.style.display = 'none';

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                errorBox.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                errorBox.style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                errorBox.textContent = 'Las contraseñas no coinciden.';
                errorBox.style.display = 'block';
                return;
            }

            setPasswordBtn.disabled = true;
            setPasswordBtn.textContent = 'Guardando...';

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                errorBox.textContent = error.message || 'No se pudo configurar la contraseña. Intente de nuevo.';
                errorBox.style.display = 'block';
                setPasswordBtn.disabled = false;
                setPasswordBtn.textContent = 'Configurar Contraseña';
                return;
            }

            successBox.textContent = 'Contraseña configurada. Redirigiendo a inicio de sesión...';
            successBox.style.display = 'block';
            form.style.display = 'none';

            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        });
    </script>

</body>
</html>
