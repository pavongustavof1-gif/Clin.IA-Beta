<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Clin.IA™</title>

    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='favicon/android-chrome-192x192.png') }}">
    <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='favicon/android-chrome-512x512.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-md);
        }

        .login-card {
            width: 100%;
            max-width: 380px;
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .login-header h1 {
            font-family: 'DM Serif Display', Georgia, serif;
            font-weight: 400;
            font-style: italic;
            font-size: 2.4rem;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .login-field {
            margin-bottom: var(--spacing-md);
        }

        .login-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .login-input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            padding: 0.65rem 0.85rem;
            line-height: 1.5;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .login-input:focus {
            outline: none;
            border-color: #7b9cef;
            box-shadow: 0 0 0 3px rgba(123,156,239,0.15);
        }

        .login-error {
            display: none;
            background: rgba(224, 82, 82, 0.08);
            border: 1px solid rgba(224, 82, 82, 0.25);
            border-radius: var(--radius-sm);
            color: #c0392b;
            font-size: 0.86rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        .login-success {
            display: none;
            background: rgba(15, 110, 86, 0.08);
            border: 1px solid rgba(15, 110, 86, 0.25);
            border-radius: var(--radius-sm);
            color: #0F6E56;
            font-size: 0.86rem;
            padding: 0.6rem 0.85rem;
            margin-bottom: var(--spacing-md);
        }

        #loginBtn {
            max-width: 100%;
            margin-top: var(--spacing-xs);
        }

        .forgot-password-link {
            display: block;
            text-align: center;
            margin-top: var(--spacing-md);
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .forgot-password-link:hover {
            color: #0F6E56;
        }

        #forgotPasswordBtn {
            max-width: 100%;
            margin-top: var(--spacing-xs);
        }
    </style>
</head>
<body>

    <div class="login-page">
        <div class="card login-card">
            <div class="login-header">
                <h1>Clin.IA™</h1>
                <p>Iniciar Sesión</p>
            </div>

            <div id="loginError" class="login-error"></div>

            <form id="loginForm">
                <div class="login-field">
                    <label class="login-label" for="email">Correo electrónico</label>
                    <input type="email" id="email" class="login-input" autocomplete="email" required>
                </div>
                <div class="login-field">
                    <label class="login-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="login-input" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <a href="#" id="forgotPasswordLink" class="forgot-password-link">¿Olvidaste tu contraseña?</a>

            <div id="forgotPasswordWrap" style="display: none;">
                <div id="forgotPasswordError" class="login-error"></div>
                <div id="forgotPasswordSuccess" class="login-success"></div>

                <form id="forgotPasswordForm">
                    <div class="login-field">
                        <label class="login-label" for="forgotEmail">Correo electrónico</label>
                        <input type="email" id="forgotEmail" class="login-input" autocomplete="email" required>
                    </div>
                    <button type="submit" id="forgotPasswordBtn" class="btn btn-primary">Enviar enlace</button>
                    <a href="#" id="backToLoginLink" class="forgot-password-link">Volver a iniciar sesión</a>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
    <script nonce="{{ csp_nonce }}">
        window.CLINIA_CONFIG = { supabaseUrl: "{{ supabase_url }}", supabaseAnonKey: "{{ supabase_anon_key }}" };
    </script>
    <script src="{{ url_for('static', filename='auth-common.js') }}"></script>
    <script nonce="{{ csp_nonce }}">
        // login.html's own flow (signInWithPassword, forgot-password) —
        // legitimately page-specific, uses the shared supabaseClient from
        // auth-common.js rather than being forced into a shared
        // abstraction that doesn't fit a pre-auth page.
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Iniciando sesión...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error || !data?.session) {
                errorBox.textContent = 'Correo o contraseña incorrectos.';
                errorBox.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar Sesión';
                return;
            }

            sessionStorage.setItem('clinia_email', data.user.email);
            window.location.href = '/';
        });

        // Forgot-password inline flow — reveals an email-only field below
        // the login form rather than navigating to a separate page.
        const forgotLink       = document.getElementById('forgotPasswordLink');
        const backToLoginLink  = document.getElementById('backToLoginLink');
        const forgotWrap       = document.getElementById('forgotPasswordWrap');
        const forgotForm       = document.getElementById('forgotPasswordForm');
        const forgotErrorBox   = document.getElementById('forgotPasswordError');
        const forgotSuccessBox = document.getElementById('forgotPasswordSuccess');
        const forgotBtn        = document.getElementById('forgotPasswordBtn');

        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            form.style.display = 'none';
            forgotLink.style.display = 'none';
            forgotWrap.style.display = 'block';
        });

        backToLoginLink.addEventListener('click', (e) => {
            e.preventDefault();
            forgotWrap.style.display = 'none';
            forgotErrorBox.style.display = 'none';
            forgotSuccessBox.style.display = 'none';
            forgotForm.style.display = 'block';
            document.getElementById('forgotEmail').value = '';
            form.style.display = 'block';
            forgotLink.style.display = 'block';
        });

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            forgotErrorBox.style.display = 'none';
            forgotSuccessBox.style.display = 'none';

            const email = document.getElementById('forgotEmail').value.trim();

            // Client-side format check only — never a signal about whether
            // an account exists, just basic input sanity before the call.
            if (!email || !email.includes('@') || !email.split('@').pop().includes('.')) {
                forgotErrorBox.textContent = 'Ingrese un correo electrónico válido.';
                forgotErrorBox.style.display = 'block';
                return;
            }

            forgotBtn.disabled = true;
            forgotBtn.textContent = 'Enviando...';

            // Deliberately ignore the call's error/data entirely below —
            // the response must never reveal whether this email has an
            // account (account-enumeration protection). Same generic
            // message regardless of outcome, including network failure.
            try {
                await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: 'https://app.clinianotes.com/set-password'
                });
            } catch (err) {
                console.error('[ClinIA] resetPasswordForEmail error:', err);
            }

            forgotForm.style.display = 'none';
            forgotSuccessBox.textContent = 'Si el correo existe, recibirás un enlace en unos minutos.';
            forgotSuccessBox.style.display = 'block';
            forgotBtn.disabled = false;
            forgotBtn.textContent = 'Enviar enlace';
        });
    </script>

</body>
</html>
