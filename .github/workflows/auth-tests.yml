name: Auth Test Suite

# Runs the route-level authorization suite (backend/tests/) so an
# authorization regression shows red on the commit/PR before it can be
# deployed — Render deploys are triggered manually, this is the gate
# ahead of that, not a replacement for it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values only, never real credentials — Config.validate() at
    # app.py import time requires each of these to be *present*, but
    # backend/tests/conftest.py mocks every network call app.py could
    # make with them (Supabase REST/Storage/Auth, AssemblyAI, Gemini,
    # Resend), so the actual values are never used for anything. Setting
    # them here (rather than relying solely on conftest.py's own
    # os.environ.setdefault calls) keeps the workflow self-evidently
    # offline-safe on inspection, without depending on that fallback.
    env:
      SUPABASE_URL: https://fake-ci-project.supabase.co
      SUPABASE_SERVICE_KEY: fake-ci-service-key
      SUPABASE_ANON_KEY: fake-ci-anon-key
      GEMINI_API_KEY: fake-ci-gemini-key
      ASSEMBLYAI_API_KEY: fake-ci-assemblyai-key
      FLASK_SECRET_KEY: fake-ci-flask-secret
      RESEND_API_KEY: fake-ci-resend-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches backend/Dockerfile's `FROM python:3.11-slim` — the
          # only place a Python version is actually pinned in this repo
          # (no runtime.txt / render.yaml / .python-version exist).
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Run route-level authorization test suite
        run: pytest backend/tests/ -v
