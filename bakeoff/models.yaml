# bakeoff/models.yaml — the models compared in the #83 bake-off.
#
# Sources (read 2026-11-11):
#   IDs, supported parameters, prices:
#     https://assemblyai.com/docs/llm-gateway/available-models
#   In-region surcharge: https://www.assemblyai.com/pricing — "In-region
#     (US/EU) pricing is 10% higher due to provider cost increases; add
#     "model_region": "global" to your API requests to get the rates shown."
#     The bake-off never sends model_region (the request stays in the US
#     region, like a future production cutover would), so every call pays the
#     listed rate + 10%.
#   Request/usage shape: https://assemblyai.com/docs/api-reference/llm-gateway/create-chat-completion
#
# price_in / price_out: USD per 1M tokens at the listed (global) rate.
# accepts_temperature: whether the model's "Supported parameters" list on
#   available-models includes temperature (absent for Claude Haiku/Sonnet 5.5,
#   so it is never sent to them).
# est_output_tokens: ESTIMATE ONLY (for `estimate` and the budget check): a
#   full SOAP JSON note is ~1,200-1,600 tokens; Gemini 2.5 Flash also bills its
#   default "thinking" as output tokens, hence the higher figure. Replace with
#   observed averages after the first runs (`tally` reports them).
# optional: true = not run unless named with --models.
# timeout_s: read timeout per attempt. 120 s for Gemini; 300 s for Claude,
#   which reasons before answering (smoke test 2026-11-11: Haiku 5.5 spent
#   2,695 of 3,359 output tokens on reasoning; Sonnet 5.5 hit ReadTimeout at
#   120 s). The Gateway docs give no timeout guidance.
# max_tokens: output cap sent to the Gateway (reasoning tokens count toward
#   it). Default 8192 when absent. gemini-2.5-flash: 16384 — in the full run
#   2026-11-12 it failed 2 of 9 (BO-02 run 2, BO-06 run 1) with finish_reason
#   max_tokens at 8,188 output tokens: its thinking used most of the budget and
#   the JSON was cut off. Production sets no output cap. Truncated runs are
#   repeated by `extract` (not counted as done).
# output_mode: how JSON is requested (bakeoff/gateway.py OUTPUT_MODES):
#   none | json_object | json_schema. Decision 2026-11-11: no schema for any
#   model, to match production (Gemini gets response_mime_type JSON, no
#   schema). json_object would be used where the Gateway documents it, but
#   neither available-models nor the create-chat-completion reference nor
#   llm-gateway/structured-outputs mentions json_object for any model — the
#   only documented response_format type is json_schema — so all are "none":
#   no response_format, the prompt's JSON template only.

surcharge: 0.10          # in-region +10% (see above)

models:
  gemini-2.5-flash:
    model: gemini-2.5-flash
    role: "baseline — production today"
    price_in: 0.30
    price_out: 2.50
    accepts_temperature: true
    est_output_tokens: 3500
    output_mode: none
    timeout_s: 120
    max_tokens: 16384

  gemini-3.5-flash-lite:
    model: gemini-3.5-flash-lite
    role: "what production silently becomes on 1 Dec"
    price_in: 0.30
    price_out: 2.50
    accepts_temperature: true
    est_output_tokens: 2500
    output_mode: none
    timeout_s: 120

  claude-haiku-5-5:
    model: claude-haiku-5-5
    role: "candidate"
    price_in: 0.10
    price_out: 0.50
    accepts_temperature: false
    est_output_tokens: 1600
    output_mode: none
    timeout_s: 300

  claude-sonnet-5-5:
    model: claude-sonnet-5-5
    role: "candidate"
    price_in: 2.00
    price_out: 10.00
    accepts_temperature: false
    est_output_tokens: 1600
    output_mode: none
    timeout_s: 300

  # Optional variant. available-models lists `reasoning_effort` among
  # gemini-3.5-flash-lite's supported parameters; choose-a-model gives example
  # values "such as `none`, `low`, or `high`" but no page documents the enum
  # or default. (In the smoke test the default already used 0 reasoning
  # tokens.) Run it explicitly
  # (--models gemini-3.5-flash-lite@low) after a 1-call smoke test.
  gemini-3.5-flash-lite@low:
    model: gemini-3.5-flash-lite
    role: "1 Dec model, lowest reasoning"
    price_in: 0.30
    price_out: 2.50
    accepts_temperature: true
    reasoning_effort: low
    est_output_tokens: 1800
    output_mode: none
    timeout_s: 120
    optional: true

  # Optional Claude variants with less reasoning. available-models lists
  # reasoning_effort for both Claude 5.5 models; llm-gateway/choose-a-model
  # names example values "such as `none`, `low`, or `high`" and says "Only
  # models that list `reasoning_effort` in `supported_parameters` accept it".
  # No page documents the enum, the default, or how it maps to Claude's
  # thinking budget — run a 1-call smoke test first. Run only when named:
  #   --models claude-haiku-5-5@low,claude-sonnet-5-5@low
  claude-haiku-5-5@low:
    model: claude-haiku-5-5
    role: "candidate, low reasoning"
    price_in: 0.10
    price_out: 0.50
    accepts_temperature: false
    reasoning_effort: low
    est_output_tokens: 2000
    output_mode: none
    timeout_s: 300
    optional: true

  claude-sonnet-5-5@low:
    model: claude-sonnet-5-5
    role: "candidate, low reasoning"
    price_in: 2.00
    price_out: 10.00
    accepts_temperature: false
    reasoning_effort: low
    est_output_tokens: 2000
    output_mode: none
    timeout_s: 300
    optional: true

# Automated judges (`python -m bakeoff judge`): each scores every blind note,
# one note per call, with bakeoff/inputs/judge_rubric.md. Same fields as
# above. They only ever see blind/ pages (masked), the transcript and the
# scenario's reference — never the key, other notes or model names.
# est_output_tokens: ESTIMATE ONLY — the JSON verdict is ~400 tokens, plus
# reasoning (Claude 5.5 and Gemini 2.5 Flash both reason by default; Haiku
# spent 2,695 reasoning tokens on a note in the smoke test).
judges:
  claude-sonnet-5-5:
    model: claude-sonnet-5-5
    price_in: 2.00
    price_out: 10.00
    accepts_temperature: false
    est_output_tokens: 4000
    output_mode: none
    timeout_s: 300
    max_tokens: 16384

  gemini-2.5-flash:
    model: gemini-2.5-flash
    price_in: 0.30
    price_out: 2.50
    accepts_temperature: true
    est_output_tokens: 4000
    output_mode: none
    timeout_s: 300
    max_tokens: 16384

# Token estimation (no tokenizer offline). Spanish prompt text averages about
# 3.5 characters per token; 3.0 is used to over- rather than under-estimate.
# Audio scenarios not yet transcribed are sized from their audio_minutes at
# ~900 transcript characters per minute of conversation (≈150 words/min).
# note_chars sizes judge prompts when blind/ doesn't exist yet.
estimation:
  chars_per_token: 3.0
  transcript_chars_per_audio_minute: 900
  note_chars: 5000          # a note as the judge sees it, used before blind/ exists
